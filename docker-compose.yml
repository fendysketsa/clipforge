  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8010}
    container_name: fendy-clipper-frontend
    environment:
      BACKEND_API_BASE: http://172.18.0.1:8010
      BACKEND_API_BASES: http://172.18.0.1:8010,http://172.17.0.1:8010,http://host.docker.internal:8010,http://127.0.0.1:8010
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./backend
    container_name: fendy-clipper-telegram-bot
    command: ["python", "telegram_bot.py"]
    network_mode: host
    volumes:
      - ./backend/outputs:/app/outputs:ro
      - ./backend/data:/app/data
      - /sys:/host/sys:ro
    environment:
      BACKEND_API_BASE: http://127.0.0.1:8010
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
